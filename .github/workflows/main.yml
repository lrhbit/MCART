name: 构建 Windows 原生版 (GraalVM native-image)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mc-pixel-art-converter/mc-pixel-art-converter/src/**'
      - 'mc-pixel-art-converter/mc-pixel-art-converter/lib/**'
      - 'mc-pixel-art-converter/mc-pixel-art-converter/scripts/**'
      - '.github/workflows/**'

jobs:
  windows-native:
    name: Windows x64 原生 exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mc-pixel-art-converter/mc-pixel-art-converter
        shell: pwsh

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 校验工程目录
        run: |
          Write-Host "PWD=$((Get-Location).Path)"
          if (-not (Test-Path 'lib/flatlaf-3.7.1.jar')) { throw '找不到 lib/flatlaf-3.7.1.jar，工程目录层级不对' }
          Get-ChildItem -Force | Select-Object -ExpandProperty Name

      - name: 安装 GraalVM CE JDK 25（含 native-image）
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          version: '25.0.2'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'true'

      - name: 加载 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认工具链
        run: |
          java -version
          native-image --version

      - name: 编译主程序、资源与采集器
        run: |
          New-Item -ItemType Directory -Force target/classes | Out-Null
          Get-ChildItem src/main/java -Recurse -Filter *.java |
            Where-Object FullName -NotMatch 'META-INF' |
            Select-Object -ExpandProperty FullName > target/srcs.txt
          javac -encoding UTF-8 --release 17 -d target/classes -cp "lib/*" @target/srcs.txt
          Copy-Item -Recurse src/main/resources/* target/classes/ -Force
          javac -encoding UTF-8 -cp "target/classes;lib/*" -d target/classes scripts/native/NativeTrace.java

      - name: 采集原生镜像元数据（NativeTrace 自动走完界面后自行退出）
        run: java -agentlib:native-image-agent=config-output-dir=target/classes/META-INF/native-image/mcart/ci -cp "target/classes;lib/flatlaf-3.7.1.jar" NativeTrace

      - name: native-image 编译为 mcart.exe（控制台子系统，便于自检与排错）
        run: |
          New-Item -ItemType Directory -Force target/dist | Out-Null
          native-image --no-fallback --parallelism=1 --gc=serial -J-Xmx5500m -cp "target/classes;lib/flatlaf-3.7.1.jar" -H:Class=com.axolotl.mcart.Main -o target/dist/mcart -H:+ReportExceptionStackTraces -H:+AddAllCharsets -Djava.awt.headless=false --initialize-at-run-time=com.axolotl.mcart,com.formdev.flatlaf

      - name: 准备随包字体配置（文本版 fontconfig.properties，勿放 .bfc）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/dist/lib | Out-Null
          $jh = $env:JAVA_HOME
          Write-Host "JAVA_HOME=$jh"
          # 关键：sun.awt.fontconfig 指向的文件会被 JDK 一律按“文本 properties”解析，
          # 因此这里必须放文本配置（JDK 自带的 fontconfig.properties.src 改名），
          # 绝不能放二进制 fontconfig.bfc（会被当文本解析 -> getInitELC NPE）。
          $srcProps = Join-Path $jh 'lib\fontconfig.properties.src'
          if (-not (Test-Path $srcProps)) { throw "JDK 缺少文本字体配置模板: $srcProps" }
          Copy-Item $srcProps 'target/dist/lib/fontconfig.properties' -Force
          # exe 同目录也放一份（覆盖 Main 的 fontconfig.properties 候选与相对 CWD 启动场景）
          Copy-Item $srcProps 'target/dist/fontconfig.properties' -Force
          # flavormap：AWT 数据传输/复制粘贴所需，缺失不致命，能带上就带上
          $fm = Join-Path $jh 'lib\flavormap.properties'
          if (Test-Path $fm) { Copy-Item $fm 'target/dist/lib/flavormap.properties' -Force; Write-Host '已随包 flavormap.properties' } else { Write-Host 'JDK 中未找到 flavormap.properties，跳过' }
          #双保险：确保 dist（含 lib 与 exe 同目录）没有任何 .bfc（setupFontConfig 会优先选中它并导致 NPE）
          Get-ChildItem 'target/dist' -Recurse -Filter '*.bfc' -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item $_.FullName -Force; Write-Host "移除二进制字体配置: $($_.FullName)" }
          #内容自检：文本字体配置必须包含 version 与 sequence 定义
          $text = Get-Content 'target/dist/lib/fontconfig.properties' -Raw -Encoding UTF8
          Write-Host ("fontconfig.properties 字节数: " + (Get-Item 'target/dist/lib/fontconfig.properties').Length)
          if ($text -notmatch 'version') { throw 'fontconfig.properties 缺少 version 定义，内容不完整' }
          if ($text -notmatch 'sequence') { throw 'fontconfig.properties 缺少 sequence 定义，内容不完整' }
          Write-Host '=== target/dist/lib 内容 ==='
          Get-ChildItem target/dist/lib | Select-Object Name,Length

      - name: CI 真机冒烟自测（实际运行 exe，确认字体初始化与主窗口创建成功）
        shell: pwsh
        run: |
          Push-Location target/dist
          try {
            Write-Host '=== dist 目录内容（确认 exe/dll/字体文件齐全）==='
            Get-ChildItem -Recurse | Select-Object FullName,Length
            $dir = (Get-Location).Path
            $exe = Join-Path $dir 'mcart.exe'
            $logPath = Join-Path $dir 'launch-log.txt'
            if (Test-Path $logPath) { Remove-Item $logPath -Force }
            # 最接近“双击”：工作目录=exe 所在目录，不做输出重定向（避免管道缓冲吞掉早期日志）
            $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
            Start-Sleep -Seconds 4
            Write-Host ("启动后: Id={0} HasExited={1}" -f $p.Id,$p.HasExited)
            if ($p.HasExited) { Write-Host ("ExitCode={0}" -f $p.ExitCode) }
            $ok = $false
            for ($i=0; $i -lt 28; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $logPath) {
                $t = Get-Content $logPath -Raw -Encoding UTF8
                if ($t -match '主窗口已显示') { $ok = $true; break }
                if ($t -match 'Fontconfig|no ComponentUI|创建窗口失败|启动致命错误|java.home property not set') { break }
              }
              if ($p.HasExited) {
                Start-Sleep -Seconds 1
                if (Test-Path $logPath) { $t = Get-Content $logPath -Raw -Encoding UTF8; if ($t -match '主窗口已显示') { $ok = $true } }
                break
              }
            }
            Write-Host ("冒烟判定: HasExited={0} ok={1}" -f $p.HasExited,$ok)
            Get-Process -Name mcart -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {} }
            Start-Sleep -Seconds 1
            Write-Host '===== dist/launch-log.txt ====='
            if (Test-Path $logPath) { Get-Content $logPath -Raw -Encoding UTF8 } else { Write-Host '(dist 下未生成 launch-log.txt)' }
            Write-Host '===== 全工作区搜索 launch-log.txt ====='
            $ws = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { 'D:\a\a-a-a\a-a-a' }
            $found = Get-ChildItem -Path $ws -Recurse -Filter 'launch-log.txt' -ErrorAction SilentlyContinue
            if ($found) { foreach ($f in $found) { Write-Host "---- $($f.FullName) ----"; Get-Content $f.FullName -Raw -Encoding UTF8 } } else { Write-Host '(工作区内未找到任何 launch-log.txt)' }
            if (-not $ok) { throw '冒烟自测失败：exe 未能成功初始化字体并创建主窗口，详见上方 launch-log' }
            Write-Host '冒烟自测通过：字体初始化正常，主窗口成功创建。'
          } finally {
            Pop-Location
          }

      - name: 打包为 zip（exe + 同目录 dll + lib 字体配置）
        run: |
          Remove-Item target/dist/smoke-out.txt,target/dist/smoke-err.txt,target/dist/launch-log.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path target/dist/* -DestinationPath mcart-windows-x64.zip -Force
          Write-Host '=== dist 产物清单 ==='
          Get-ChildItem target/dist -Recurse | Select-Object FullName,Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mcart-windows-x64
          path: mc-pixel-art-converter/mc-pixel-art-converter/mcart-windows-x64.zip
          retention-days: 30
