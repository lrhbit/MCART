name: 构建 Windows 原生版 (GraalVM native-image)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mc-pixel-art-converter/mc-pixel-art-converter/src/**'
      - 'mc-pixel-art-converter/mc-pixel-art-converter/lib/**'
      - 'mc-pixel-art-converter/mc-pixel-art-converter/scripts/**'
      - '.github/workflows/**'

jobs:
  windows-native:
    name: Windows x64 原生 exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mc-pixel-art-converter/mc-pixel-art-converter
        shell: pwsh
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 校验工程目录
        run: |
          Write-Host "PWD=$((Get-Location).Path)"
          if (-not (Test-Path 'lib/flatlaf-3.7.1.jar')) { throw '找不到 lib/flatlaf-3.7.1.jar，工程目录层级不对' }
          Get-ChildItem -Force | Select-Object -ExpandProperty Name

      - name: 安装 GraalVM CE JDK 25（含 native-image）
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          version: '25.0.2'
          components: 'native-image'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-default: 'true'

      - name: 加载 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认工具链
        run: |
          java -version
          native-image --version

      - name: 编译主程序与资源
        run: |
          New-Item -ItemType Directory -Force target/classes | Out-Null
          Get-ChildItem src/main/java -Recurse -Filter *.java |
            Where-Object FullName -NotMatch 'META-INF' |
            Select-Object -ExpandProperty FullName > target/srcs.txt
          javac -encoding UTF-8 --release 17 -d target/classes -cp "lib/*" @target/srcs.txt
          Copy-Item -Recurse src/main/resources/* target/classes/ -Force

      - name: CI agent采集元数据（源码完全不动）
        run: |
          New-Item -ItemType Directory -Force target/graal-config | Out-Null
          java -Djava.awt.headless=true -DskipUI=true -agentlib:native-image-agent=config-output-dir=target/graal-config `
            -cp "target/classes;lib/*" com.axolotl.mcart.Main

      - name: native-image 编译为 mcart.exe
        run: |
          New-Item -ItemType Directory -Force target/dist | Out-Null
          native-image --no-fallback `
            --parallelism=1 --gc=serial -J-Xmx5500m `
            --enable-swing `
            --enable-native-access=ALL-UNNAMED `
            --install-exit-handlers `
            -H:ConfigurationFileDirectories=target/graal-config `
            -H:Class=com.axolotl.mcart.Main `
            -o target/dist/mcart `
            -H:+ReportExceptionStackTraces `
            -H:+AddAllCharsets `
            -H:+IncludeAllLocales `
            -H:IncludeResources=.*fontconfig.* `
            -H:IncludeResources=.*fonts/.* `
            -H:IncludeResources=com/formdev/flatlaf/** `
            -H:IncludeResources=net/miginfocom/** `
            --initialize-at-run-time=com.axolotl.mcart.core,com.axolotl.mcart.ui

      - name: 打包为 zip
        run: |
          Compress-Archive -Path target/dist/* -DestinationPath mcart-windows-x64.zip -Force
          Write-Host "=== dist 产物清单 ==="
          Get-ChildItem target/dist | Select-Object Name,Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mcart-windows-x64
          path: mc-pixel-art-converter/mc-pixel-art-converter/mcart-windows-x64.zip
          retention-days: 30
