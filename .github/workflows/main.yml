name: 构建 Windows 原生版 (GraalVM native-image)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mc-pixel-art-converter/mc-pixel-art-converter/src/**'
      - 'mc-pixel-art-converter/mc-pixel-art-converter/lib/**'
      - 'mc-pixel-art-converter/mc-pixel-art-converter/scripts/**'
      - '.github/workflows/**'

jobs:
  windows-native:
    name: Windows x64 原生 exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mc-pixel-art-converter/mc-pixel-art-converter
        shell: pwsh

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 校验工程目录
        run: |
          Write-Host "PWD=$((Get-Location).Path)"
          if (-not (Test-Path 'lib/flatlaf-3.7.1.jar')) { throw '找不到 lib/flatlaf-3.7.1.jar，工程目录层级不对' }
          Get-ChildItem -Force | Select-Object -ExpandProperty Name

      - name: 安装 GraalVM CE JDK 25（含 native-image）
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          version: '25.0.2'
          components: 'native-image'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'true'
          set-java-default: 'true'

      - name: 加载 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认工具链
        run: |
          java -version
          native-image --version

      - name: 编译主程序、资源与采集器
        run: |
          New-Item -ItemType Directory -Force target/classes | Out-Null
          Get-ChildItem src/main/java -Recurse -Filter *.java |
            Where-Object FullName -NotMatch 'META-INF' |
            Select-Object -ExpandProperty FullName > target/srcs.txt
          javac -encoding UTF-8 --release 17 -d target/classes -cp "lib/*" @target/srcs.txt
          Copy-Item -Recurse src/main/resources/* target/classes/ -Force
          javac -encoding UTF-8 -cp "target/classes;lib/*" -d target/classes scripts/native/NativeTrace.java

      - name: 采集原生镜像元数据（NativeTrace 自动走完界面后自行退出）
        run: java -agentlib:native-image-agent=config-output-dir=target/classes/META-INF/native-image/mcart/ci -cp "target/classes;lib/*" NativeTrace

      - name: native-image 编译为 mcart.exe（无黑窗 GUI 子系统，长命令单行书写）
        run: |
          New-Item -ItemType Directory -Force target/dist | Out-Null
          native-image --no-fallback --parallelism=1 --gc=serial -J-Xmx5500m --report-unsupported-elements-at-runtime -cp "target/classes;lib/*" -H:Class=com.axolotl.mcart.Main -o target/dist/mcart -H:+ReportExceptionStackTraces -H:+AddAllCharsets -H:NativeLinkerOption=/SUBSYSTEM:WINDOWS -H:NativeLinkerOption=/ENTRY:mainCRTStartup -H:IncludeResources=Logo/.* --initialize-at-run-time=com.axolotl.mcart,com.formdev.flatlaf

      - name: 准备随包字体配置（二进制 fontconfig.bfc + flavormap.properties）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/dist/lib | Out-Null
          $jh = $env:JAVA_HOME
          Write-Host "JAVA_HOME=$jh"
          # 关键：AWT 在 Windows 默认按【二进制】加载 java.home/lib/fontconfig.bfc。
          # 绝不能设置 sun.awt.fontconfig（会强制按文本解析 .bfc -> getInitELC NPE），
          # 也不要放 fontconfig.properties（文本模板在 Windows 上不完整）。
          $bfc = Join-Path $jh 'lib\fontconfig.bfc'
          $fm  = Join-Path $jh 'lib\flavormap.properties'
          if (-not (Test-Path $bfc)) { throw "JDK 缺少二进制字体配置: $bfc" }
          Copy-Item $bfc 'target/dist/lib/fontconfig.bfc' -Force
          Write-Host ("fontconfig.bfc: " + (Get-Item 'target/dist/lib/fontconfig.bfc').Length + " 字节")
          if (Test-Path $fm) {
            Copy-Item $fm 'target/dist/lib/flavormap.properties' -Force
            Write-Host '已随包 flavormap.properties'
          } else {
            Write-Host 'JDK 未找到 flavormap.properties（非致命，继续）'
          }
          # 双保险：dist 内若存在任何文本 fontconfig.properties 一律移除，避免被错误优先选中
          Get-ChildItem 'target/dist' -Recurse -Filter 'fontconfig.properties*' -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-Item $_.FullName -Force; Write-Host "移除文本字体配置: $($_.FullName)"
          }
          Write-Host '=== target/dist/lib 内容 ==='
          Get-ChildItem target/dist/lib | Select-Object Name,Length

      - name: CI 真机冒烟自测（实际运行 exe，确认字体初始化与主窗口创建成功）
        shell: pwsh
        run: |
          Push-Location target/dist
          try {
            Write-Host '=== dist 目录内容（确认 exe/dll/字体文件齐全）==='
            Get-ChildItem -Recurse | Select-Object FullName,Length
            $dir = (Get-Location).Path
            $exe = Join-Path $dir 'mcart.exe'
            $logPath = Join-Path $dir 'launch-log.txt'
            if (Test-Path $logPath) { Remove-Item $logPath -Force }
            # 最接近“双击”：工作目录=exe 所在目录
            $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
            Start-Sleep -Seconds 4
            Write-Host ("启动后: Id={0} HasExited={1}" -f $p.Id,$p.HasExited)
            if ($p.HasExited) { Write-Host ("ExitCode={0}" -f $p.ExitCode) }
            $ok = $false
            for ($i=0; $i -lt 28; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $logPath) {
                $t = Get-Content $logPath -Raw -Encoding UTF8
                if ($t -match '主窗口已显示') { $ok = $true; break }
                if ($t -match 'Fontconfig|no ComponentUI|创建窗口失败|启动致命错误|java.home property not set|getInitELC|head is null') { break }
              }
              if ($p.HasExited) {
                Start-Sleep -Seconds 1
                if (Test-Path $logPath) { $t = Get-Content $logPath -Raw -Encoding UTF8; if ($t -match '主窗口已显示') { $ok = $true } }
                break
              }
            }
            Write-Host ("冒烟判定: HasExited={0} ok={1}" -f $p.HasExited,$ok)
            Get-Process -Name mcart -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {} }
            Start-Sleep -Seconds 1
            Write-Host '===== dist/launch-log.txt ====='
            if (Test-Path $logPath) { Get-Content $logPath -Raw -Encoding UTF8 } else { Write-Host '(dist 下未生成 launch-log.txt)' }
            if (-not $ok) { throw '冒烟自测失败：exe 未能成功初始化字体并创建主窗口，详见上方 launch-log' }
            Write-Host '冒烟自测通过：字体初始化正常，主窗口成功创建。'
          } finally {
            Pop-Location
          }

      - name: CI 真机交互自检（原生 exe 内展开下拉 + 文本改数字框）
        shell: pwsh
        run: |
          Push-Location target/dist
          try {
            $dir = (Get-Location).Path
            $exe = Join-Path $dir 'mcart.exe'
            $logPath = Join-Path $dir 'launch-log.txt'
            if (Test-Path $logPath) { Remove-Item $logPath -Force }
            # --selftest 会在原生镜像内部真实展开每个下拉、编辑每个数字框，随后自行退出（0=通过）
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -WorkingDirectory $dir -PassThru
            $exited = $p.WaitForExit(90000)
            if (-not $exited) {
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
              throw '交互自检超时（90s 未自行退出）'
            }
            Start-Sleep -Seconds 1
            Write-Host '===== selftest launch-log.txt ====='
            if (Test-Path $logPath) { Get-Content $logPath -Raw -Encoding UTF8 } else { throw '未生成 launch-log.txt' }
            $code = $p.ExitCode
            $t = Get-Content $logPath -Raw -Encoding UTF8
            if ($code -ne 0) { throw "交互自检失败：退出码 $code" }
            if ($t -notmatch '交互自检通过') { throw '交互自检未出现“交互自检通过”标记' }
            Write-Host '交互自检通过：所有下拉可展开、所有数字框可通过文本改值。'
          } finally {
            Get-Process -Name mcart -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: 打包为 zip（exe + 同目录 dll + lib 字体配置）
        run: |
          Remove-Item target/dist/launch-log.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path target/dist/* -DestinationPath mcart-windows-x64.zip -Force
          Write-Host '=== dist 产物清单 ==='
          Get-ChildItem target/dist -Recurse | Select-Object FullName,Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mcart-windows-x64
          path: mc-pixel-art-converter/mc-pixel-art-converter/mcart-windows-x64.zip
          retention-days: 30
