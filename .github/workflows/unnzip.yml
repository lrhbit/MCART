name: Auto Unzip Zip
on:
  push:
    paths:
      - '**.zip' # 只要上传zip就触发
  workflow_dispatch: # 支持手动点按钮运行

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须这个权限，才能回写仓库
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip all zip files
        run: |
          for f in *.zip; do
            unzip -o "$f"
            rm "$f"
          done

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto unzip zip file" || true
          git push
